<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        ComicCraft
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

    <header class="site-header">

        <a
            class="brand"
            href="/"
        >
            ComicCraft
        </a>

        <span class="tagline">
            Turn your idea into a comic
        </span>

    </header>


    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <script
        src="{{ url_for('static', path='css/js/app.js') }}"
    ></script>

</body>

</html>
